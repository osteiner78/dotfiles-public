# basic_auth hashes come from a root-only file outside the repo; see the Caddyfile {$..._AUTH_HASH} placeholders.
# --environ is dropped from ExecStart so the hashes are not printed to the journal.
[Service]
EnvironmentFile=/etc/caddy/caddy.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
